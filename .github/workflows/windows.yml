name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Builds the installer. Download it from the run's "Artifacts" section.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: clementine-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Runs the conversion engine tests against the real tools on Windows.
  engine-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install conversion tools
        shell: pwsh
        run: choco install ffmpeg pandoc libreoffice-fresh ghostscript 7zip -y --no-progress
      - name: Run engine tests
        shell: pwsh
        working-directory: src-tauri
        run: |
          rustc --edition 2021 --test src/converter.rs -o conv_tests.exe
          ./conv_tests.exe --test-threads=2
